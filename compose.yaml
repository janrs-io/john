# /opt/stacks/john/compose.yaml
services:
  john-web:
    image: ghcr.io/pnpm/pnpm:11.3.0
    container_name: john-web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "4321:4321"
    command: >
      bash -c "
      ([ -x /root/.local/share/pnpm/nodejs/24*/bin/node ] || pnpm runtime set node 24 -g)
      && ([ -x /app/node_modules/.bin/astro ] || (pnpm install && pnpm prune))
      && /app/node_modules/.bin/astro dev --host 0.0.0.0"
    volumes:
      - ./:/app
      - john_node_modules:/app/node_modules
    networks:
      - dev-proxy

volumes:
  john_node_modules:

networks:
  dev-proxy:
    external: true
